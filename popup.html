<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { font-family: Roboto, Arial, sans-serif; width: 240px; padding: 12px; margin: 0; }
      label { display: block; font-size: 13px; margin: 10px 0 6px; }
      select, input { width: 100%; padding: 4px; box-sizing: border-box; }
      small { display: block; color: #666; margin-top: 4px; font-size: 11px; }
    </style>
  </head>
  <body>
    <label for="nativeLang">Native language (second line)</label>
    <select id="nativeLang">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="th">ไทย</option>
      <option value="zh-Hans">中文（简体）</option>
    </select>

    <label for="apiKey">MiniMax API key (Netflix translation)</label>
    <input id="apiKey" type="password" autocomplete="off">
    <small>Stored locally in this browser only.</small>

    <label>Saved translations</label>
    <button id="clearCache" type="button">Clear translation cache</button>
    <small id="cacheStatus"></small>

    <script src="popup.js"></script>
  </body>
</html>
